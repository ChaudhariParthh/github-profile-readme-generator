<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="100%" height="100%">
  <defs>
    <radialGradient id="cg-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0B0F2A"/>
      <stop offset="100%" stopColor="#020617"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="62%" cy="42%" r="50%">
      <stop offset="0%" stopColor="#EC4899" stopOpacity="0.8"/>
      <stop offset="40%" stopColor="#A855F7" stopOpacity="0.55"/>
      <stop offset="70%" stopColor="#3B82F6" stopOpacity="0.25"/>
      <stop offset="100%" stopColor="#0B0F2A" stopOpacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="30%" cy="60%" r="45%">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.65"/>
      <stop offset="50%" stopColor="#3B82F6" stopOpacity="0.35"/>
      <stop offset="100%" stopColor="#0B0F2A" stopOpacity="0"/>
    </radialGradient>
    <radialGradient id="planet1" cx="32%" cy="32%" r="65%">
      <stop offset="0%" stopColor="#C4B5FD"/>
      <stop offset="35%" stopColor="#7C3AED"/>
      <stop offset="70%" stopColor="#312E81"/>
      <stop offset="100%" stopColor="#050816"/>
    </radialGradient>
    <radialGradient id="planet2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#67E8F9"/>
      <stop offset="40%" stopColor="#0284C7"/>
      <stop offset="85%" stopColor="#03264A"/>
      <stop offset="100%" stopColor="#020D1A"/>
    </radialGradient>
  </defs>

  <rect width="400" height="96" fill="url(#cg-bg)"/>

  <!-- Nebulae -->
  <ellipse cx="250" cy="40" rx="140" ry="44" fill="url(#nebula1)"/>
  <ellipse cx="120" cy="55" rx="100" ry="38" fill="url(#nebula2)"/>

  <!-- Star field -->
  <g fill="#FFFFFF">
    <circle cx="14" cy="18" r="0.7" opacity="0.7"/>
    <circle cx="35" cy="12" r="1.1" opacity="0.85"/>
    <circle cx="65" cy="28" r="0.8" opacity="0.7"/>
    <circle cx="95" cy="14" r="0.9" opacity="0.8"/>
    <circle cx="125" cy="22" r="0.7" opacity="0.65"/>
    <circle cx="155" cy="10" r="1.2" opacity="0.95"/>
    <circle cx="185" cy="26" r="0.8" opacity="0.75"/>
    <circle cx="215" cy="12" r="1.0" opacity="0.85"/>
    <circle cx="245" cy="24" r="0.8" opacity="0.7"/>
    <circle cx="275" cy="14" r="1.3" opacity="0.95"/>
    <circle cx="305" cy="28" r="0.7" opacity="0.65"/>
    <circle cx="335" cy="16" r="1.1" opacity="0.85"/>
    <circle cx="365" cy="24" r="0.8" opacity="0.7"/>
    <circle cx="390" cy="12" r="1.0" opacity="0.85"/>
    <circle cx="45" cy="75" r="0.7" opacity="0.6"/>
    <circle cx="85" cy="82" r="0.9" opacity="0.75"/>
    <circle cx="170" cy="78" r="1.1" opacity="0.9"/>
    <circle cx="225" cy="84" r="0.8" opacity="0.7"/>
    <circle cx="290" cy="76" r="1.0" opacity="0.85"/>
    <circle cx="350" cy="80" r="0.8" opacity="0.75"/>
  </g>

  <!-- Nova crosses -->
  <path d="M275 14 L276 9 L277 14 L282 15 L277 16 L276 21 L275 16 L270 15 Z" fill="#FDF4FF" opacity="0.95"/>
  <path d="M155 10 L156 6 L157 10 L161 11 L157 12 L156 16 L155 12 L151 11 Z" fill="#E0F2FE" opacity="0.9"/>

  <!-- Ringed Planet -->
  <g transform="translate(68, 50)">
    <circle cx="0" cy="0" r="28" fill="url(#planet1)"/>
    <path d="M -26 -8 C -15 -2, 15 -2, 26 -8" stroke="#A78BFA" strokeWidth="1.2" opacity="0.35" fill="none"/>
    <path d="M -27 2 C -15 8, 15 8, 27 2" stroke="#4C1D95" strokeWidth="1.5" opacity="0.45" fill="none"/>
    <ellipse cx="0" cy="0" rx="48" ry="14" transform="rotate(-22)" stroke="#A855F7" strokeWidth="5" fill="none" opacity="0.45"/>
    <ellipse cx="0" cy="0" rx="48" ry="14" transform="rotate(-22)" stroke="#E0F2FE" strokeWidth="1.5" fill="none" opacity="0.85"/>
  </g>

  <!-- Blue Exoplanet -->
  <g transform="translate(320, 48)">
    <circle cx="0" cy="0" r="19" fill="url(#planet2)"/>
    <path d="M -14 -12 A 19 19 0 0 1 12 14 A 18 18 0 0 0 -14 -12" fill="#BAE6FD" opacity="0.85"/>
  </g>

  <!-- Distant moon -->
  <circle cx="365" cy="24" r="5" fill="#E9D5FF" opacity="0.85"/>
  <circle cx="367" cy="23" r="4.2" fill="#0B0E23"/>
</svg>
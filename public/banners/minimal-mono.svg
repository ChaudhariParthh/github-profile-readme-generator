<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="100%" height="100%">
  <defs>
    <linearGradient id="mm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#09090B"/>
      <stop offset="30%" stopColor="#18181B"/>
      <stop offset="55%" stopColor="#27272A"/>
      <stop offset="75%" stopColor="#3F3F46"/>

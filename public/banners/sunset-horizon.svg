      <stop offset="0%" stopColor="#4C0519"/>
      <stop offset="25%" stopColor="#BE185D"/>
      <stop offset="60%" stopColor="#F97316"/>
      <stop offset="90%" stopColor="#FCD34D"/>
      <stop offset="100%" stopColor="#2E020E"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="100%" height="100%">
  <defs>
    <linearGradient id="od-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#042F2E"/>
      <stop offset="45%" stopColor="#0F766E"/>
      <stop offset="85%" stopColor="#0891B2"/>
      <stop offset="100%" stopColor="#021C1B"/>
